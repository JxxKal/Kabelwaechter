    <line x1="512" y1="512" x2="0" y2="1024"></line>
    <line x1="512" y1="512" x2="1024" y2="1024"></line>
    <line x1="512" y1="512" x2="512" y2="0"></line>
    <line x1="512" y1="512" x2="1024" y2="512"></line>
    <line x1="512" y1="512" x2="512" y2="1024"></line>
    <line x1="512" y1="512" x2="0" y2="512"></line>
