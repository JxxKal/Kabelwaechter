      <line x1="384" y1="0" x2="384" y2="1024"></line>
      <line x1="512" y1="0" x2="512" y2="1024"></line>
      <line x1="640" y1="0" x2="640" y2="1024"></line>
      <line x1="768" y1="0" x2="768" y2="1024"></line>
      <line x1="896" y1="0" x2="896" y2="1024"></line>
