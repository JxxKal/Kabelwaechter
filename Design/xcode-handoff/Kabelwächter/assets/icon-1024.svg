      <line x1="0" y1="384" x2="1024" y2="384"></line>
      <line x1="0" y1="512" x2="1024" y2="512"></line>
      <line x1="0" y1="640" x2="1024" y2="640"></line>
      <line x1="0" y1="768" x2="1024" y2="768"></line>
      <line x1="0" y1="896" x2="1024" y2="896"></line>
